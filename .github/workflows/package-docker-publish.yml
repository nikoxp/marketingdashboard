# .github/workflows/package-docker-publish.yml
name: Package Docker Publish

# 触发条件：
# - 推送到 main
# - 打 semver 标签（v1.2.3）
# - 手动触发
# - 对 main 的 PR（只构建，不推送）
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # GitHub Container Registry
  REGISTRY: ghcr.io
  # 镜像名 = 仓库全名（小写），例如 nikoxp/marketingdashboard
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # 推送到 GHCR 必需
      id-token: write          # 可选：用于 cosign 签名

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 多架构构建支持（可选但推荐）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GHCR（PR 时不登录，也不推送）
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成 tags 和 labels
      # 规则示例：
      #   main        → latest + sha-xxxxxxx
      #   v1.2.3      → 1.2.3 + 1.2 + 1 + latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=ref,event=branch

      # 构建并推送（PR 只构建不推送）
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64   # 如只想 amd64 可删掉 arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 可选：构建参数（当前 Dockerfile 不需要可删）
          # build-args: |
          #   NODE_ENV=production

      # 可选：用 cosign 对镜像做签名（需要 id-token: write）
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign the published Docker image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
